name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    env:
      # Dummy key so pydantic-settings can construct Settings during test collection.
      # No test marked safe for CI ever calls a live LLM.
      GEMINI_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run unit tests (network tests excluded)
        run: pytest tests/ -m "not network" -v
      - name: Lint — syntax errors and undefined names only
        run: |
          pip install ruff
          ruff check . --select E9,F63,F7,F82

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
