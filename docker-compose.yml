services:
  jobhunter:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Generated artifacts (resumes, cover letters, reports) persist on the host
      - ./outputs:/app/outputs
      - ./memory:/app/memory
      - ./user_data:/app/user_data
    restart: unless-stopped

  # Opt-in autonomous mode: docker compose --profile autopilot up -d
  autopilot:
    build: .
    profiles: ["autopilot"]
    command: >
      python main.py autopilot
      --role "${TARGET_ROLE:-AI Engineer}"
      --niche "${TARGET_NICHE:-}"
      --market "${TARGET_MARKET:-India}"
      --at "${AUTOPILOT_AT:-08:00}"
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
      - ./memory:/app/memory
      - ./user_data:/app/user_data
    restart: unless-stopped
